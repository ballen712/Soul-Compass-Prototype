kind = "mobile"
previewPath = "/"
title = "Soul Compass"
description = "A local-first iPhone app for daily reflections, optional natal-chart exploration and a curated crystal guide."
version = "1.0.0"
id = "artifacts/soul-compass"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20060

[services.development]
run = "pnpm --filter @workspace/soul-compass run dev:web"

[services.production]
build = [ "pnpm", "--filter", "@workspace/soul-compass", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/soul-compass", "run", "serve" ]

[services.env]
PORT = "20060"
BASE_PATH = "/"
